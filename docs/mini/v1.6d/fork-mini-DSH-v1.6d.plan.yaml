phases:
  - id: CO2
    title: Stage B — parallel collaboration
    ordinal: 0
    status: ACTIVE
    description: >
      Stage B of the v1.6d scope proposal
      (docs/mini/v1.6d/fork-mini-DSH-v1.6d-collaboration-scope-proposal.md),
      entered through the §33 gate on 2026-09-20 as decision
      dr:mini-dsh:v1.6d-stage-b (enter-v1.6d-stage-b selected) after stage A
      closed with all three items DONE. One domain per item, each with its
