      the stage yields to the one-domain-per-step rhythm the v1.6b domains
      set. The two agents registered during stage A are the cast this stage
      composes against.
workItems:
  - id: SB-SCOPE-RESERVATION-001
    phaseId: CO2
    type: IMPLEMENTATION
    executorKind: AGENT
    title: Scope reservations prevent overlap through the ledger
    description: >
      The scope-reservation domain (v1.6 blueprint attachment §21, adapted
      to the v1.6a ledger like the v1.6d stage-A domains): an actor's
      exclusive claim on one project scope (a repository path) while working
      a work item, as ledger schema v8 through one appended 7→8 migration,
      required vocabulary events (scope/reserved, scope/released,
      scope/expired — event format 8 with adjacent reads), one active
      reservation per project scope as index, seam, and fold fact, an
      expiry-and-release lifecycle mirroring the work leases, a newest-first
      project read with the item and actor labels resolved, replay-audit and
      doctor parity, and the read-only /project reservations view. The
      blueprint's mode column is dropped: every reservation ships exclusive.
    priority: 10
    status: READY
    acceptance:
      - id: AC-SB-SCOPE-RESERVATION-001
        kind: TEST
        description: The project-ledger, project-ledger-sqlite, and mini-profile package suites pass with the scope-reservation domain covered.
        required: true
        verifier:
          kind: TEST
          command: pnpm exec vitest run project-ledger project-ledger-sqlite mini-profile
          expectedExitCode: 0
          sandboxRequired: true
          approvalRequired: false
  - id: SB-CONFLICT-RECORD-001
    phaseId: CO2
    type: IMPLEMENTATION
    executorKind: AGENT
    title: Collaboration conflicts recorded through the ledger
    description: >
      The collaboration-conflict domain (v1.6 blueprint attachment §29,
      adapted): one recorded overlap that slipped through the reservations —
      conflict kind, raised-by actor, the two work items, inline description
      over the blueprint's content indirection, and a resolution that points
      at the v1.6b decisions domain — as ledger schema v9 through one
      appended 8→9 migration with the required conflict/recorded and
      conflict/resolved events (event format 9 with adjacent reads), seam,
      read, parity, and the read-only /project conflicts view.
    priority: 20
    status: READY
    acceptance:
      - id: AC-SB-CONFLICT-RECORD-001
        kind: TEST
        description: The project-ledger, project-ledger-sqlite, and mini-profile package suites pass with the collaboration-conflict domain covered.
        required: true
        verifier:
          kind: TEST
          command: pnpm exec vitest run project-ledger project-ledger-sqlite mini-profile
          expectedExitCode: 0
          sandboxRequired: true
          approvalRequired: false
