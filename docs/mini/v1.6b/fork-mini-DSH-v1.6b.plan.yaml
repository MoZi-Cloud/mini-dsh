schemaVersion: 1
project:
  id: mini-dsh
  name: mini-DSH
plan:
  id: mini-dsh-v16b-owner-decision
  name: v1.6b Owner Decision Domain
  version: 2
phases:
  - id: DEC1
    title: Owner decision and approval records
    ordinal: 0
    status: ACTIVE
    description: >
      The v1.6b owner/decision/resource domain (proposal "v1.6b — Owner /
      Decision / Resource Domain"), entered through the §33 gate on
      2026-09-19. Version 1 carried the decision and approval domains;
      version 2 batches the remaining scope: resource
      requirements/instances/verifications next, actors/roles basic
      expansion after. Fresh stable keys only — version 1's items stay
      recorded under version 1.
workItems:
  - id: PB-RESOURCE-RECORD-001
    phaseId: DEC1
    type: IMPLEMENTATION
    executorKind: AGENT
    title: Resource requirements, instances, and verifications recorded through the ledger
    description: >
      The resource loop (v1.6 blueprint attachment §25/§26/§27, adapted to
      the v1.6a ledger like the decision and approval domains): a project
      opens resource requirements, instances are provided against them, and
      each instance is verified PASS or FAIL against a stored spec — as
      ledger schema v4 tables, three required vocabulary events
      (resource/required, resource/provided, resource/verified, event
      format 4 with adjacent reads), transactional write seams, a
      newest-first project read nesting instances and verifications,
      replay-audit and doctor parity over the new families, and the
      read-only /project resources view.
    priority: 10
    status: READY
    acceptance:
      - id: AC-PB-RESOURCE-RECORD-001
        kind: TEST
        description: The project-ledger, project-ledger-sqlite, and mini-profile package suites pass with the resource domain covered.
        required: true
        verifier:
          kind: TEST
          command: pnpm exec vitest run project-ledger project-ledger-sqlite mini-profile
          expectedExitCode: 0
          sandboxRequired: true
          approvalRequired: false
  - id: PB-ACTOR-ROLE-001
    phaseId: DEC1
    type: IMPLEMENTATION
    executorKind: AGENT
    title: Actors and roles recorded as first-class ledger rows
    description: >
      Actors/roles basic expansion (v1.6 blueprint attachment): actor and
      role tables that give the decision and approval domains' actor
      strings and required_role references a durable referent, with the
      same event/replay/command treatment the earlier v1.6b domains
      established.
    priority: 20
    status: READY
    acceptance:
      - id: AC-PB-ACTOR-ROLE-001
        kind: TEST
        description: The project-ledger, project-ledger-sqlite, and mini-profile package suites pass with the actor/role domain covered.
        required: true
        verifier:
          kind: TEST
          command: pnpm exec vitest run project-ledger project-ledger-sqlite mini-profile
          expectedExitCode: 0
          sandboxRequired: true
          approvalRequired: false
relations: []
