schemaVersion: 1
project:
  id: mini-dsh
  name: mini-DSH
plan:
  id: mini-dsh-post-v16a-increments
  name: Post-v1.6a Real-Use Increments
  version: 1
phases:
  - id: INC1
    title: Post-v1.6a increments
    ordinal: 0
    status: ACTIVE
    description: >
      Real repository work claimed, verified, and completed through the mounted
      Project Ledger, accumulating the §33 real-use record one increment at a
      time. Items land in the order priority names; each carries a stored
      verifier command the real-use lane executes.
workItems:
  - id: PW-PRESENTERS-001
    phaseId: INC1
    type: IMPLEMENTATION
    executorKind: AGENT
    title: Host presenters for the project_work tools
    description: >
      Give project_work_next, project_work_claim, and project_work_update pure
      presentCall generic views so a Host UI titles and icons their pending
      cards from the call args alone; the completed card keeps the title over
      the rendered result, and the Web Client keeps deriving its cards from the
      raw events.
    priority: 10
    status: READY
    acceptance:
      - id: AC-PW-PRESENTERS-001
        kind: TEST
        description: The mini-profile package suite passes, including the presenter assertions.
        required: true
        verifier:
          kind: TEST
          command: pnpm exec vitest run mini-profile
          expectedExitCode: 0
          sandboxRequired: true
          approvalRequired: false
  - id: PW-REPORT-VERDICTS-001
    phaseId: INC1
    type: IMPLEMENTATION
    executorKind: AGENT
    title: Per-criterion verdicts in project_work_update reports
    description: >
      Let action report carry one verdict per observable criterion instead of
      applying a single PASS or FAIL to all of them, so an agent can report a
      suite where some verifiers passed and others failed without splitting
      the claim.
    priority: 20
    status: READY
    acceptance:
      - id: AC-PW-REPORT-VERDICTS-001
        kind: TEST
        description: The mini-profile package suite passes with the per-criterion report path covered.
        required: true
        verifier:
          kind: TEST
          command: pnpm exec vitest run mini-profile
          expectedExitCode: 0
          sandboxRequired: true
          approvalRequired: false
  - id: PW-OBSERVED-TAIL-001
    phaseId: INC1
    type: IMPLEMENTATION
    executorKind: AGENT
    title: Record the verifier output tail with each report
    description: >
      Extend project_work_update's report to accept a bounded tail of the
      verifier output and store it in the acceptance evaluation's observed
      payload beside the exit code, so a replayed ledger shows why a criterion
      passed or failed without re-running the command.
    priority: 30
    status: READY
    acceptance:
      - id: AC-PW-OBSERVED-TAIL-001
        kind: TEST
        description: The mini-profile package suite passes with the observed-tail path covered.
        required: true
        verifier:
          kind: TEST
          command: pnpm exec vitest run mini-profile
          expectedExitCode: 0
          sandboxRequired: true
          approvalRequired: false
relations: []
