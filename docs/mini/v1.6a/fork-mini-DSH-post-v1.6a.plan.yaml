schemaVersion: 1
project:
  id: mini-dsh
  name: mini-DSH
plan:
  id: mini-dsh-post-v16a-increments
  name: Post-v1.6a Real-Use Increments
  version: 3
phases:
  - id: INC1
    title: Post-v1.6a increments
    ordinal: 0
    status: ACTIVE
    description: >
      Real repository work claimed, verified, and completed through the mounted
      Project Ledger, accumulating the §33 real-use record one increment at a
      time. Items land in the order priority names; each carries a stored
      verifier command the real-use lane executes. Version 3 supersedes the
      completed version-2 items (PW-ITEM-REVIEW-001, PW-REPLAY-VIEW-001) with
      a fresh batch.
workItems:
  - id: PW-DOCSYNC-GREEN-001
    phaseId: INC1
    type: MAINTENANCE
    executorKind: AGENT
    title: Full doc-sync gate green on the fork
    description: >
      Make the repository's complete documentation gate pass on this fork:
      document every exported API the gate demands (error codes, schema
      mirrors, id factories), register the ctx.projectLedger service in the
      cordis catalog and capability-seam tables with its own subsystems page
      carried bilingually, regenerate the generated catalogs (config catalog,
      capability seams) with their language sides in sync, and repair the
      archived proposal documents' code fences and package-path references.
      The verifier is the gate itself.
    priority: 10
    status: READY
    acceptance:
      - id: AC-PW-DOCSYNC-GREEN-001
        kind: TEST
        description: The repository's complete doc-sync gate passes with zero failed checks.
        required: true
        verifier:
          kind: TEST
          command: pnpm run doc-sync
          expectedExitCode: 0
          sandboxRequired: true
          approvalRequired: false
  - id: PW-EVIDENCE-DIGEST-001
    phaseId: INC1
    type: IMPLEMENTATION
    executorKind: AGENT
    title: Owner evidence digest view in /project
    description: >
      Give /project a digest subcommand that aggregates the ledger's
      read-only evidence into one owner-facing summary — plan versions and
      their statuses, per-item completion with latest verdicts, and the
      replay audit verdict — so the owner reads the whole §33 record without
      SQL or per-item commands. The view only reads; the Owner domain stays
      v1.6b scope.
    priority: 20
    status: READY
    acceptance:
      - id: AC-PW-EVIDENCE-DIGEST-001
        kind: TEST
        description: The mini-profile package suite passes with the digest view path covered.
        required: true
        verifier:
          kind: TEST
          command: pnpm exec vitest run mini-profile
          expectedExitCode: 0
          sandboxRequired: true
          approvalRequired: false
relations: []
