schemaVersion: 1
project:
  id: mini-dsh
  name: mini-DSH
plan:
  id: mini-dsh-post-v16a-increments
  name: Post-v1.6a Real-Use Increments
  version: 4
phases:
  - id: INC1
    title: Post-v1.6a increments
    ordinal: 0
    status: ACTIVE
    description: >
      Real repository work claimed, verified, and completed through the mounted
      Project Ledger, accumulating the §33 real-use record one increment at a
      time. Items land in the order priority names; each carries a stored
      verifier command the real-use lane executes. Version 4 supersedes the
      completed version-3 items (PW-DOCSYNC-GREEN-001, PW-EVIDENCE-DIGEST-001)
      with a fresh batch.
workItems:
  - id: PW-EXPORT-VIEW-001
    phaseId: INC1
    type: IMPLEMENTATION
    executorKind: AGENT
    title: Owner evidence export view in /project
    description: >
      Give /project an export subcommand that renders the whole-project
      evidence record as one archival markdown block the owner can paste into
      the §33 record or a review: plan versions with their baselines and
      supersede stamps, per-item completion with every acceptance criterion's
      status and latest verdict (evaluator, time, observed exit code and
      output-tail excerpt), and the replay audit verdict. The digest read seam
      carries per-criterion rows for this; the view only reads, and the Owner
      domain stays v1.6b scope.
    priority: 10
    status: READY
    acceptance:
      - id: AC-PW-EXPORT-VIEW-001
        kind: TEST
        description: The mini-profile package suite passes with the export view path covered.
        required: true
        verifier:
          kind: TEST
          command: pnpm exec vitest run mini-profile
          expectedExitCode: 0
          sandboxRequired: true
          approvalRequired: false
  - id: PW-ITEM-HISTORY-001
    phaseId: INC1
    type: IMPLEMENTATION
    executorKind: AGENT
    title: Per-item evaluation history view in /project
    description: >
      Give /project a history subcommand that lists one work item's full
      evaluation timeline — every recorded attempt newest-first with its
      verdict, evaluator, time, and observed evidence — the attempts the
      review's latest-only view hides, so the owner reads why an item passed
      or failed at each point in time. The view only reads.
    priority: 20
    status: READY
    acceptance:
      - id: AC-PW-ITEM-HISTORY-001
        kind: TEST
        description: The mini-profile package suite passes with the history view path covered.
        required: true
        verifier:
          kind: TEST
          command: pnpm exec vitest run mini-profile
          expectedExitCode: 0
          sandboxRequired: true
          approvalRequired: false
relations: []
