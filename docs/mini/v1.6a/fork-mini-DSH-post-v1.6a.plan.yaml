schemaVersion: 1
project:
  id: mini-dsh
  name: mini-DSH
plan:
  id: mini-dsh-post-v16a-increments
  name: Post-v1.6a Real-Use Increments
  version: 2
phases:
  - id: INC1
    title: Post-v1.6a increments
    ordinal: 0
    status: ACTIVE
    description: >
      Real repository work claimed, verified, and completed through the mounted
      Project Ledger, accumulating the §33 real-use record one increment at a
      time. Items land in the order priority names; each carries a stored
      verifier command the real-use lane executes. Version 2 supersedes the
      completed version-1 items (PW-PRESENTERS-001, PW-REPORT-VERDICTS-001,
      PW-OBSERVED-TAIL-001) with a fresh batch.
workItems:
  - id: PW-ITEM-REVIEW-001
    phaseId: INC1
    type: IMPLEMENTATION
    executorKind: AGENT
    title: Item review view in /project
    description: >
      Give /project an item subcommand over a new ledger read seam: one work
      item resolved by stable key or id, showing each acceptance criterion's
      status and latest evaluation — verdict, evaluator, exit code, and a
      bounded excerpt of the observed output tail — so the owner reads why an
      item passed or failed without SQL. The view only reads; the Owner domain
      stays v1.6b scope.
    priority: 10
    status: READY
    acceptance:
      - id: AC-PW-ITEM-REVIEW-001
        kind: TEST
        description: The mini-profile package suite passes with the item review path covered.
        required: true
        verifier:
          kind: TEST
          command: pnpm exec vitest run mini-profile
          expectedExitCode: 0
          sandboxRequired: true
          approvalRequired: false
  - id: PW-REPLAY-VIEW-001
    phaseId: INC1
    type: IMPLEMENTATION
    executorKind: AGENT
    title: Replay projection view in /project
    description: >
      Give /project a replay subcommand that runs the ledger's event replay
      for the resolved project and reports the replayed projection against the
      materialized rows, so the owner audits ledger integrity read-only.
    priority: 20
    status: READY
    acceptance:
      - id: AC-PW-REPLAY-VIEW-001
        kind: TEST
        description: The mini-profile package suite passes with the replay view path covered.
        required: true
        verifier:
          kind: TEST
          command: pnpm exec vitest run mini-profile
          expectedExitCode: 0
          sandboxRequired: true
          approvalRequired: false
relations: []
