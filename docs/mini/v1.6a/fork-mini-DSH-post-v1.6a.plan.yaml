schemaVersion: 1
project:
  id: mini-dsh
  name: mini-DSH
plan:
  id: mini-dsh-post-v16a-increments
  name: Post-v1.6a Real-Use Increments
  version: 5
phases:
  - id: INC1
    title: Post-v1.6a increments
    ordinal: 0
    status: ACTIVE
    description: >
      Real repository work claimed, verified, and completed through the mounted
      Project Ledger, accumulating the §33 real-use record one increment at a
      time. Items land in the order priority names; each carries a stored
      verifier command the real-use lane executes. Version 5 supersedes the
      completed version-4 items (PW-EXPORT-VIEW-001, PW-ITEM-HISTORY-001)
      with a fresh batch.
workItems:
  - id: PW-LEASE-DOCTOR-001
    phaseId: INC1
    type: IMPLEMENTATION
    executorKind: AGENT
    title: Stale active leases surfaced by the plan doctor
    description: >
      The plan doctor's read-only pass gains a lease-staleness check: a
      work_leases row that still records ACTIVE past its own expiry — exactly
      the rows the caller-driven, batched reaper would reap — becomes a
      reported issue, with the reading clock as the check's only input. A
      cold or behind reaper leaves such rows, and replay parity cannot see
      them because the fold projects the same ACTIVE status; the doctor
      names them instead, so the operator knows recovery is owed.
    priority: 10
    status: READY
    acceptance:
      - id: AC-PW-LEASE-DOCTOR-001
        kind: TEST
        description: The project-ledger and mini-profile package suites pass with the staleness check covered.
        required: true
        verifier:
          kind: TEST
          command: pnpm exec vitest run project-ledger mini-profile
          expectedExitCode: 0
          sandboxRequired: true
          approvalRequired: false
  - id: PW-4K-GATE-001
    phaseId: INC1
    type: IMPLEMENTATION
    executorKind: AGENT
    title: 4K no-regression gate recorded through the ledger
    description: >
      The §33 BOOT/4K no-regression bar enters the ledger record itself:
      this item's stored verifier runs the pinned 4K context-light real-use
      slice as a real subprocess, so completing it records the gate's
      outcome as ledger data beside the prose log — entry evidence of the
      kind §33 asks for, not a design claim.
    priority: 20
    status: READY
    acceptance:
      - id: AC-PW-4K-GATE-001
        kind: TEST
        description: The pinned 4K context-light lane passes as the item's stored verifier.
        required: true
        verifier:
          kind: TEST
          command: sh benchmarks/context-light/run-4k.sh
          expectedExitCode: 0
          sandboxRequired: true
          approvalRequired: false
relations: []
